name: Dependency Security Audit

on:
  schedule:
    - cron: '0 1 * * 1'
  push:
    branches:
      - main
      - develop
      
jobs:
  security_audit:
    runs-on: ubuntu-latest
    
    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v4

      - name: 🛠️ Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: 🔎 Run Bun Security Audit
        run: bun audit